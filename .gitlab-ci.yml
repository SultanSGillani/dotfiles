---
stages:
  - linting
variables:
  GIT_SUBMODULE_STRATEGY: recursive
  PIP_CACHE_DIR: "${CI_PROJECT_DIR}/.cache"
  ANSIBLE_HOST_KEY_CHECKING: "False"
  ANSIBLE_LIBRARY: "./library:./library/ansible-aur/library"
cache:
  paths:
    - .cache/

.linting: &linting
  stage: linting

yamllint:
  <<: *linting
  image: registry.gitlab.com/sultangillani/docker-yamllint:latest
  script:
    - yamllint -c ./.yamllint -f standard .

ansible-lint:
  <<: *linting
  image: registry.gitlab.com/sultangillani/docker-ansible-lint:latest
  script:
    - chmod 0700 .
    - ansible-lint -c .ansible-lint dotfiles.yml darwin.yml linux.yml sudo.yml vmware.yml

ansible-syntax-check:
  <<: *linting
  image: registry.gitlab.com/sultangillani/docker-ansible-lint:latest
  script:
    - ansible-playbook -i inventory.yml --syntax-check dotfiles.yml
    - ansible-playbook -i inventory.yml --syntax-check darwin.yml
    - ansible-playbook -i inventory.yml --syntax-check linux.yml
    - ansible-playbook -i inventory.yml --syntax-check sudo.yml
    - ansible-playbook -i inventory.yml --syntax-check vmware.yml
